set-option -gw xterm-keys on

# Easy split pane commands
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Easy split pane commands
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Non-repeating pane navigation
bind-key Up    select-pane -U
bind-key Down  select-pane -D
bind-key Left  select-pane -L
bind-key Right select-pane -R

# Scrollback/History limit
set -g history-limit 1000000

# Mouse: trackpad scroll enters copy-mode so scrollback is reachable
set -g mouse on

# --- Scrolling full-screen TUIs (codex / claude / vim / less) ---------------
# These run on the ALTERNATE screen: it has NO tmux scrollback, so `prefix [`
# copy-mode + k/C-u have nothing to scroll (that history lives inside the app).
# Trackpad works only because the app itself handles the wheel. Two real fixes:
#
# 1) In the app, use ITS OWN scroll (codex/claude: PageUp/PageDown or the mouse).
# 2) prefix + u  → open THIS pane's captured raw log as clean, paged, searchable
#    text (uses the pipe-pane auto-log below). Real keyboard scrollback for TUIs.
bind u run-shell 'tmux new-window -n panelog "sh ~/.tmux/panelog.sh \"$HOME/.tmux/logs/pane-#{session_name}-#{window_index}-#{pane_index}-#{pane_id}.log\""'

# Shift-PageUp / Shift-PageDown: jump straight into copy-mode and page (handy for
# NORMAL shell panes, where copy-mode scrollback works fine).
bind -n S-PageUp   copy-mode -u
bind -n S-PageDown send-keys -X -N 1 page-down

# Pane logs: prefix+P toggles raw output capture for the current pane.
# Logs are useful when fullscreen TUIs make terminal scrollback hard to inspect.
bind P if -F "#{pane_pipe}" "pipe-pane; display-message 'Stopped pane logging'" "pipe-pane 'cat >> $HOME/.tmux/logs/pane-#{session_name}-#{window_index}-#{pane_index}-#{pane_id}.log'; display-message 'Logging pane to ~/.tmux/logs/pane-#{session_name}-#{window_index}-#{pane_index}-#{pane_id}.log'"
set-hook -g after-new-window 'pipe-pane -o "cat >> $HOME/.tmux/logs/pane-#{session_name}-#{window_index}-#{pane_index}-#{pane_id}.log"'
set-hook -g after-split-window 'pipe-pane -o "cat >> $HOME/.tmux/logs/pane-#{session_name}-#{window_index}-#{pane_index}-#{pane_id}.log"'

# Claude Code logs: prefix+L browse past sessions, prefix+T tail active session
bind L new-window -n cclog "exec $HOME/.claude/bin/cclog"
bind T new-window -n cctail "exec $HOME/.claude/bin/cclog tail"

set -g status-bg "#262626"
set -g status-fg white
set -g status-right ""

#TPM
# install git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

setw -g mode-keys vi #vim-style movement 

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
